<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Jarvis — Ravi ka assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #080d18; color: #eef4ff;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: 28px;
      text-align: center; border: 1px solid #263650;
      border-radius: 24px; background: #101a2b;
    }
    h1 { margin: 0; color: #68d9ff; letter-spacing: 4px; }
    .sub { color: #aab9d0; }
    select, input, button {
      width: 100%; margin-top: 12px; padding: 14px;
      border-radius: 12px; border: 1px solid #344862;
      background: #0b1321; color: white; font-size: 16px;
    }
    button { cursor: pointer; background: #123c58; }
    #mic { font-size: 20px; background: #087ea4; }
    #answer {
      margin-top: 20px; padding: 16px; min-height: 64px;
      border-radius: 12px; background: #0b1321;
      text-align: left; white-space: pre-wrap;
    }
    small { display: block; margin-top: 16px; color: #9bacbf; }
  </style>
</head>
<body>
  <main>
    <h1>JARVIS</h1>
    <p class="sub">Personal assistant for Ravi</p>

    <select id="language" aria-label="Choose language">
      <option value="hi-IN">हिन्दी</option>
      <option value="en-US">English</option>
    </select>

    <button id="mic">🎙️ Mic se baat karein</button>
    <input id="message" placeholder="Yahan apna command likhein">
    <button id="send">Jarvis ko bhejein</button>

    <div id="answer">Namaste Ravi! Mic dabakar boliye ya command type kijiye.</div>
    <small>Mic permission maange toh Allow dabayein.</small>
  </main>

  <script>
    const answerBox = document.querySelector("#answer");
    const messageBox = document.querySelector("#message");
    const language = document.querySelector("#language");

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = language.value;
      speechSynthesis.speak(voice);
    }

    function reply(text) {
      answerBox.textContent = text;
      speak(text);
    }

    function handleCommand(rawText) {
      const text = rawText.toLowerCase();
      const hindi = language.value === "hi-IN";
      let response;

      if (text.includes("time") || text.includes("समय") || text.includes("टाइम")) {
        response = hindi
          ? `Ravi, abhi ${new Date().toLocaleTimeString("hi-IN")} baj rahe hain.`
          : `Ravi, the time is ${new Date().toLocaleTimeString("en-US")}.`;
      } else if (text.includes("date") || text.includes("तारीख")) {
        response = hindi
          ? `Ravi, aaj ${new Date().toLocaleDateString("hi-IN")} hai.`
          : `Ravi, today's date is ${new Date().toLocaleDateString("en-US")}.`;
      } else if (/hello|hi|नमस्ते|हेलो/.test(text)) {
        response = hindi
          ? "Namaste Ravi! Main aapka Jarvis hoon."
          : "Hello Ravi! I am your Jarvis assistant.";
      } else {
        response = hindi
          ? "Ravi, aapka command mil gaya. Coding ke liye AI service jodni hogi."
          : "Ravi, I received your command. Coding needs an AI service connection.";
      }
      reply(response);
    }

    document.querySelector("#send").addEventListener("click", () => {
      const text = messageBox.value.trim();
      if (text) handleCommand(text);
    });

    document.querySelector("#mic").addEventListener("click", () => {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) {
        reply("Ravi, voice recognition ke liye Android Chrome try karein.");
        return;
      }

      const recognition = new Recognition();
      recognition.lang = language.value;
      recognition.onresult = event => {
        const text = event.results[0][0].transcript;
        messageBox.value = text;
        handleCommand(text);
      };
      recognition.onerror = () =>
        reply("Ravi, mic nahi chala. Browser ki mic permission check karein.");
      recognition.start();
    });
  </script>
</body>
  </html>
